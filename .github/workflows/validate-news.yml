name: Validate Verified News

on:
  push:
    branches: [main]
    paths:
      - "data/news.json"
      - "assets/verified-news.js"
      - "scripts/validate_news.py"
      - "schemas/news.schema.json"
      - "tests/test_verified_news.py"
      - ".github/workflows/validate-news.yml"
  pull_request:
    paths:
      - "data/news.json"
      - "assets/verified-news.js"
      - "scripts/validate_news.py"
      - "schemas/news.schema.json"
      - "tests/test_verified_news.py"
      - ".github/workflows/validate-news.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate facts and verification evidence
        run: python scripts/validate_data.py --scope news
      - name: Test blocked and allowed news
        run: python -m unittest discover -s tests -p test_verified_news.py -v
      - name: Check browser script syntax
        run: node --check assets/verified-news.js
