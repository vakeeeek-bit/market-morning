name: Japan Market Close Update

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_japan_market.py"
      - "data/japan-universe.json"
      - ".github/workflows/japan-market-close.yml"
  schedule:
    # 日本時間 平日15:45（UTC 06:45）
    - cron: "45 6 * * 1-5"

permissions:
  contents: write

concurrency:
  # 履歴保存ワークフローと同じ直列キューに入れ、同時pushを防ぐ。
  group: archive-market-morning
  cancel-in-progress: false

jobs:
  update-japan-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Calculate Japan market rankings and scenario review
        run: python scripts/update_japan_market.py
      - name: Validate JSON and archive
        run: |
          python -m json.tool data/japan-market.json > /dev/null
          DATE_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          mkdir -p "data/history/$DATE_JST"
          cp data/japan-market.json "data/history/$DATE_JST/japan-market.json"
      - name: Commit calculated data
        # Feature branches run the same calculation/validation as a quality gate,
        # but only main may persist generated market data. Rebasing a feature
        # branch from this step can replay the PR commits and create conflicts.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "Market Morning Bot"
          git config user.email "actions@github.com"
          git add data/japan-market.json data/history/
          if git diff --cached --quiet; then
            echo "No Japan market changes"
          else
            git commit -m "Update Japan market close data"
            git pull --rebase origin main
            git push
          fi
