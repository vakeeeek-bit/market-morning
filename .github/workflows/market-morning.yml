name: Market Morning Daily Update

on:
  workflow_dispatch:

  schedule:
    # 日本時間 毎朝7:00
    # GitHub Actions の cron は UTC
    # 22:00 UTC = 翌朝 7:00 JST
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Create data directory
        run: |
          mkdir -p data

      - name: Update market data
        run: |
          python scripts/update_market.py

      - name: Commit updated market data
        run: |
          git config user.name "Market Morning Bot"
          git config user.email "actions@github.com"

          git add data/market.json

          if git diff --cached --quiet; then
            echo "No market data changes"
          else
            git commit -m "Update daily market data"
            git push
          fi
