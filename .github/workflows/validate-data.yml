name: Validate Market Morning Data

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "japan-stocks.html"
      - "assets/publication-health.js"
      - "assets/market-observation.js"
      - "data/*.json"
      - "schemas/*.json"
      - "scripts/*.py"
      - "tests/*.py"
      - "requirements.txt"
      - ".github/workflows/validate-data.yml"
      - "!data/news.json"
      - "!schemas/news.schema.json"
      - "!scripts/validate_news.py"
      - "!tests/test_verified_news.py"
  pull_request:
    paths:
      - "index.html"
      - "japan-stocks.html"
      - "assets/publication-health.js"
      - "assets/market-observation.js"
      - "data/*.json"
      - "schemas/*.json"
      - "scripts/*.py"
      - "tests/*.py"
      - "requirements.txt"
      - ".github/workflows/validate-data.yml"
      - "!data/news.json"
      - "!schemas/news.schema.json"
      - "!scripts/validate_news.py"
      - "!tests/test_verified_news.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate current data
        run: python scripts/validate_data.py

      - name: Audit current publication freshness
        run: |
          if ! python scripts/validate_data.py --scope publish; then
            echo "::warning::総合レポートは自動公開条件未達。構造検証成功と公開品質PASSを区別してください。"
          fi

      - name: Run validation tests
        run: python -m unittest discover -s tests -v

      - name: Test price definitions and update-state browser behavior
        run: node --test tests/observation-ui.test.js
