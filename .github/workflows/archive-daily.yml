name: Archive Market Morning

on:
  push:
    branches: [main]
    paths:
      - "data/report.json"
      - "data/market.json"
  workflow_dispatch:

concurrency:
  group: archive-market-morning
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Archive report and market data
        run: python archive_daily.py

      - name: Validate archived JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("data/history").rglob("*.json"):
              with path.open(encoding="utf-8") as file:
                  json.load(file, parse_constant=lambda value: (_ for _ in ()).throw(ValueError(value)))
              print(f"Valid JSON: {path}")
          PY

      - name: Commit history files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "No history changes"
            exit 0
          fi
          git commit -m "Archive Market Morning report"
          git push
