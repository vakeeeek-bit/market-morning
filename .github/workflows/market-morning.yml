name: Market Morning Daily Update

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/market-morning.yml"
  schedule:
    # 日本時間 平日6:20（UTCでは前日の21:20）
    # GitHub Actions の cron は UTC
    # UTCの日〜木 = JSTの月〜金
    - cron: "20 21 * * 0-4"

permissions:
  contents: write

concurrency:
  group: market-morning-daily-update
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Create data directory
        run: |
          mkdir -p data

      - name: Update market data
        run: |
          python scripts/update_market.py

      - name: Update optional Japan market enrichment
        continue-on-error: true
        run: python scripts/update_japan_market.py

      - name: Validate data before publishing
        run: |
          python scripts/validate_data.py

      - name: Record successful market update
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Tokyo"))
          status = {
              "status": "success",
              "updated_at": now.strftime("%Y-%m-%d %H:%M:%S JST"),
              "message": "Market data update completed and validation passed.",
              "component": "market_data",
          }
          Path("data/status.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate final publish bundle
        run: |
          python scripts/validate_data.py

      - name: Save market history
        run: |
          DATE_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          mkdir -p "data/history/$DATE_JST"
          cp data/market.json "data/history/$DATE_JST/market.json"
          cp data/japan-market.json "data/history/$DATE_JST/japan-market.json"
          echo "Saved market history: $DATE_JST"

      - name: Commit updated market data
        run: |
          git config user.name "Market Morning Bot"
          git config user.email "actions@github.com"
          git add data/market.json
          git add data/japan-market.json
          git add data/status.json
          git add data/history/
          if git diff --cached --quiet; then
            echo "No market data changes"
          else
            git commit -m "Update daily market data"
            git push
          fi
