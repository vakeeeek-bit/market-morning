name: Market Morning Daily Update

on:
  workflow_dispatch:

  schedule:
    # 日本時間 毎朝7:07
    # GitHub Actions の cron は UTC
    # 22:07 UTC = 翌朝7:07 JST
    - cron: "7 22 * * *"

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Create data directory
        run: |
          mkdir -p data

      - name: Update market data
        run: |
          python scripts/update_market.py

      - name: Save market history
        run: |
          DATE_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)

          mkdir -p "data/history/$DATE_JST"

          cp data/market.json \
             "data/history/$DATE_JST/market.json"

          echo "Saved market history: $DATE_JST"

      - name: Commit updated market data
        run: |
          git config user.name "Market Morning Bot"
          git config user.email "actions@github.com"

          git add data/market.json
          git add data/history/

          if git diff --cached --quiet; then
            echo "No market data changes"
          else
            git commit -m "Update daily market data"
            git push
          fi
